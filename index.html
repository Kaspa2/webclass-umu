<!DOCTYPE HTML>
<HTML>
    <head>
        <title>Calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="main">
        <table>
        <tr><td colspan="4"><textarea rows="1" cols="20" id="txt">0</textarea></td></tr>
        <tr><td><button class="btn">C</button></td><td><button class="btn">&divide;</button></td><td><button class="btn">&times;</button></td><td><button class="btn">&#x232B;</button></td></tr>
        <tr><td><button class="btn2">7</button></td><td><button class="btn2">8</button></td><td><button class="btn2">9</button></td><td><button class="btn">&minus;</button></td></tr>
        <tr><td><button class="btn2">4</button></td><td><button class="btn2">5</button></td><td><button class="btn2">6</button></td><td><button class="btn">&plus;</button></td></tr>
        <tr><td><button class="btn2">1</button></td><td><button class="btn2">2</button></td><td><button class="btn2">3</button></td><td rowspan="2"><button class="btn3">&equals;</button></td></tr>
        <tr><td><button class="btn2">&percnt;</button></td><td><button class="btn2">0</button></td><td><button class="btn2">&period;</button></td></tr>
        </table>
        </div>
    </body>
</HTML>
